apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mentoraschool-deployer-binding
subjects:
  - kind: ServiceAccount
    name: mentoraschool-deployer-sa
    namespace: "${NAMESPACE_PLACEHOLDER}"
roleRef:
  kind: Role
  name: mentoraschool-deployer
  apiGroup: rbac.authorization.k8s.io

# NOTE: Replace ${NAMESPACE_PLACEHOLDER} with your target namespace before applying,
# or run the template through sed in CI to set it to the value of K8S_NAMESPACE.