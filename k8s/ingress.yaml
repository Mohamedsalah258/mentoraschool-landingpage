apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mentoraschool-landingpage-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Request a certificate from cert-manager (ClusterIssuer must exist)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - www.mentoraschool.com
        - school.mentoragroupe.com
      secretName: mentoraschool-tls
  rules:
    - host: www.mentoraschool.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mentoraschool-landingpage-svc
                port:
                  number: 80
    - host: school.mentoragroupe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mentoraschool-landingpage-svc
                port:
                  number: 80
